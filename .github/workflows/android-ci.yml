name: Android CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-android:
    name: Analyze, test, and build Android
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: stable
          cache: true

      - name: Install Android SDK components
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Configure Gradle for CI
        run: |
          ci_gradle_home="${GRADLE_USER_HOME:-$HOME/.gradle}"
          mkdir -p "$ci_gradle_home"
          cat >> "$ci_gradle_home/gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
          org.gradle.workers.max=2
          org.gradle.vfs.watch=false
          org.gradle.console=plain
          kotlin.daemon.jvmargs=-Xmx1G
          EOF

      - name: Build release APK
        run: flutter build apk --release --verbose

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: ournego-android-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
