name: Release

# Automated SemVer releases driven by Conventional Commits.
#
# 1. release-please keeps a "release PR" open on main. It bumps the version in
#    pubspec.yaml and updates CHANGELOG.md from the commit history.
# 2. Merging that PR creates the vX.Y.Z tag and its GitHub release.
# 3. This workflow then builds the signed APK from that tag and attaches it to
#    the release as ournego-beta.apk.
#
# Manual run: pass an existing tag to (re)build and re-attach its APK.

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build the APK for (e.g. v0.2.0)'
        required: true
        type: string

# Never cancel a run midway: that could leave a release without its APK.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release PR and tag
    if: github.event_name == 'push'
    runs-on: ubuntu-22.04
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          # A personal token (optional) lets CI run on the release PR; the
          # default GITHUB_TOKEN works but does not trigger other workflows.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-apk:
    name: Build and attach the APK
    needs: release-please
    # `!cancelled()` keeps this job eligible when release-please is skipped
    # (manual runs); the condition below decides whether it really runs.
    if: >-
      ${{ !cancelled() &&
      (needs.release-please.outputs.release_created == 'true' ||
      github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Configure Gradle for CI
        run: |
          ci_gradle_home="${GRADLE_USER_HOME:-$HOME/.gradle}"
          mkdir -p "$ci_gradle_home"
          cat >> "$ci_gradle_home/gradle.properties" <<'EOF2'
          org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
          org.gradle.workers.max=2
          org.gradle.vfs.watch=false
          org.gradle.console=plain
          kotlin.daemon.jvmargs=-Xmx1G
          EOF2

      - name: Write compile-time environment file
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
          MAPBOX_USERNAME: ${{ secrets.MAPBOX_USERNAME }}
          MAPBOX_STYLE_ID_DARK: ${{ secrets.MAPBOX_STYLE_ID_DARK }}
          MAPBOX_STYLE_ID_LIGHT: ${{ secrets.MAPBOX_STYLE_ID_LIGHT }}
          LOCATIONIQ_API_KEY: ${{ secrets.LOCATIONIQ_API_KEY }}
        run: |
          umask 077
          for name in SUPABASE_URL SUPABASE_ANON_KEY MAPBOX_ACCESS_TOKEN MAPBOX_USERNAME MAPBOX_STYLE_ID_DARK MAPBOX_STYLE_ID_LIGHT LOCATIONIQ_API_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is not set; the APK would ship without configuration."
              exit 1
            fi
          done
          {
            echo "SUPABASE_URL=$SUPABASE_URL"
            echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"
            echo "MAPBOX_ACCESS_TOKEN=$MAPBOX_ACCESS_TOKEN"
            echo "MAPBOX_USERNAME=$MAPBOX_USERNAME"
            echo "MAPBOX_STYLE_ID_DARK=$MAPBOX_STYLE_ID_DARK"
            echo "MAPBOX_STYLE_ID_LIGHT=$MAPBOX_STYLE_ID_LIGHT"
            echo "LOCATIONIQ_API_KEY=$LOCATIONIQ_API_KEY"
          } > "$RUNNER_TEMP/release.env"

      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is not set; refusing to publish a debug-signed APK."
              exit 1
            fi
          done
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
          cat > android/key.properties <<EOF2
          storeFile=upload-keystore.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF2

      - name: Build release APK
        run: |
          # Version comes from the tag (vX.Y.Z -> X.Y.Z); the build number only
          # has to grow with every build, so the run number is enough.
          flutter build apk --release \
            --build-name="${RELEASE_TAG#v}" \
            --build-number="${{ github.run_number }}" \
            --dart-define-from-file="$RUNNER_TEMP/release.env"

      - name: Verify APK signature
        run: |
          set -euo pipefail
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)"
          "$apksigner" verify --print-certs build/app/outputs/flutter-apk/app-release.apk \
            | grep -E "certificate (DN|SHA-1)"

      - name: Remove secrets from disk
        if: always()
        run: rm -f "$RUNNER_TEMP/release.env" android/key.properties android/upload-keystore.jks

      - name: Attach the APK to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The file name is what users download; "path#label" only sets a
          # display label, so rename the file itself before uploading.
          apk="$RUNNER_TEMP/ournego-beta.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$apk"
          gh release upload "$RELEASE_TAG" "$apk" --clobber
